<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}75 Hard{% endblock %} — GP Singh</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<nav class="navbar navbar-dark sticky-top">
  <div class="container-xl">
    <a class="navbar-brand fw-black" href="/">🔥 75 HARD</a>
    <div class="d-flex gap-2 align-items-center">
      <a href="/"          class="nav-link px-2 {% if request.path == '/' %}active{% endif %}">Dashboard</a>
      <a href="/checkin"   class="nav-link px-2 {% if request.path == '/checkin' %}active{% endif %}">Check In</a>
      <a href="/weight"    class="nav-link px-2 {% if request.path == '/weight' %}active{% endif %}">Weight</a>
      <a href="/history"   class="nav-link px-2 d-none d-md-block {% if request.path == '/history' %}active{% endif %}">History</a>
      <a href="/projects"  class="nav-link px-2 d-none d-md-block {% if request.path == '/projects' %}active{% endif %}">Projects</a>
    </div>
  </div>
</nav>

<main class="container-xl py-4 px-3">
  {% block content %}{% endblock %}
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
