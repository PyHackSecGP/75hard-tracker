<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}Tracker{% endblock %} — GP Singh</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
</head>
<body>

<nav class="navbar navbar-dark sticky-top gps-nav">
  <div class="container-xl">
    <a class="navbar-brand gps-brand" href="/">⟶ TRACKER</a>
    <div class="d-flex gap-2 align-items-center flex-wrap">
      <a href="/"          class="nav-link px-2 {% if request.path == '/' %}active{% endif %}">Dashboard</a>
      <a href="/sprint"    class="nav-link px-2 {% if request.path == '/sprint' %}active{% endif %}">Sprint</a>
      <a href="/running"   class="nav-link px-2 {% if request.path == '/running' %}active{% endif %}">Running</a>
      <a href="/checkin"   class="nav-link px-2 {% if request.path == '/checkin' %}active{% endif %}">Check In</a>
      <a href="/weight"    class="nav-link px-2 {% if request.path == '/weight' %}active{% endif %}">Weight</a>
      <a href="/nutrition" class="nav-link px-2 d-none d-md-block {% if request.path == '/nutrition' %}active{% endif %}">Nutrition</a>
      <a href="/history"   class="nav-link px-2 d-none d-md-block {% if request.path == '/history' %}active{% endif %}">History</a>
      <a href="/projects"  class="nav-link px-2 d-none d-md-block {% if request.path == '/projects' %}active{% endif %}">Projects</a>
    </div>
  </div>
</nav>

<main class="container-xl py-4 px-3">
  {% block content %}{% endblock %}
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='app.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
